version: "3.9"

services:
  # ──────────────────────────────────────────────
  # PostgreSQL 16 with pgvector extension
  # ──────────────────────────────────────────────
  db:
    image: pgvector/pgvector:pg16
    container_name: boundary_db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-boundary}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-boundary_secret}
      POSTGRES_DB: ${POSTGRES_DB:-boundary_surveys}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-boundary}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ──────────────────────────────────────────────
  # FastAPI Backend
  # ──────────────────────────────────────────────
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: boundary_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-boundary}:${POSTGRES_PASSWORD:-boundary_secret}@db:5432/${POSTGRES_DB:-boundary_surveys}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app  # Hot-reload during development

volumes:
  pgdata:
